name: build

on:
  push:
    branches:
      - test
    tags:
      - '**'

jobs:
  frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: openRenamerFront/pnpm-lock.yaml

      - name: 构建前端
        working-directory: openRenamerFront
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 拷贝产物到后端 static
        run: |
          rm -rf openRenamerBackend/static/*
          touch openRenamerBackend/static/.gitkeep
          cp -r openRenamerFront/dist/* openRenamerBackend/static/

      - uses: actions/upload-artifact@v4
        with:
          name: backend-static
          path: openRenamerBackend/static/
          retention-days: 1

  docker:
    name: 构建推送 Docker 镜像
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-static
          path: openRenamerBackend/static/

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像 tags
        id: meta
        run: |
          TAGS="fleyx/open-renamer:${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS\nfleyx/open-renamer:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: 构建推送镜像(amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    name: 打包二进制并发布 Release
    needs: frontend
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-static
          path: openRenamerBackend/static/

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 1.46.3

      - name: 打包 5 平台二进制
        working-directory: openRenamerBackend
        run: |
          mkdir -p desktop/mac-arm desktop/mac-x64 desktop/win-x64 desktop/linux-arm desktop/linux-x64
          deno task build:mac-arm
          cd desktop/mac-arm && zip -q ../renamer-mac-arm-desktop.zip renamer-arm-mac && cd ../..
          deno task build:mac-x64
          cd desktop/mac-x64 && zip -q ../renamer-mac-x64-desktop.zip renamer-x64-mac && cd ../..
          deno task build:win-x64
          cd desktop/win-x64 && zip -q ../renamer-win-x64-desktop.zip renamer-win.exe && cd ../..
          deno task build:linux-x64
          cd desktop/linux-x64 && zip -q ../renamer-linux-x64-desktop.zip renamer-x64-linux && cd ../..
          deno task build:linux-arm
          cd desktop/linux-arm && zip -q ../renamer-linux-arm-desktop.zip renamer-arm-linux && cd ../..

      - name: 发布 Release 并上传 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" openRenamerBackend/desktop/renamer-*-desktop.zip --clobber
