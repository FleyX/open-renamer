    zh: 目标路径已存在
  target-root-invalid:
    en: Target root folder does not exist
    zh: 目标根目录不存在
  source-missing:
    en: Source file is missing or is not a file
    zh: 源文件缺失或不是文件
  cross-device:
    en: Source and target are on different devices
    zh: 源与目标不在同一磁盘
  batch-not-found:
