    zh: "移动文件失败: "
  target-parent-conflict:
    en: Target path is the parent directory of another target in this batch
    zh: 目标路径是批次内其他目标的父目录
  target-overwrites-source:
    en: Target path would overwrite another source file in this batch
    zh: 目标路径会覆盖批次内其他源文件
  target-parent-not-directory:
    en: A parent of the target path exists and is not a directory
    zh: 目标路径的父级存在但不是目录
